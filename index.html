<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeFlow AI · BFT Multi-Agent Repair</title>
    <script>
      // Paint the correct theme class before stylesheet loads to avoid a FOUC.
      (function () {
        try {
          var saved = localStorage.getItem('codeflow.theme');
          var mql = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)');
          var mode = saved === 'light' || saved === 'dark' ? saved : (mql && mql.matches ? 'light' : 'dark');
          document.documentElement.classList.add(mode);
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
